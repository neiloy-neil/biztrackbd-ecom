<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings navigation</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<nav style="width:232px;display:flex;flex-direction:column;gap:4px;font-family:'Plus Jakarta Sans','Hind Siliguri',sans-serif;color:#1A1A4E">
<sc-for list="{{items}}" as="i" hint-placeholder-count="8">
<div style="display:flex;align-items:center;gap:12px;height:38px;padding:0 12px;border-radius:8px;background:{{i.bg}}">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{i.color}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{i.d}}"/></svg>
<div style="font-size:14px;font-weight:{{i.weight}};color:{{i.color}}">{{i.label}}</div>
</div>
</sc-for>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["payments","shipping","integrations","notifications","domains","staff","billing","general","languages"],"default":"payments"},"$preview":{"width":232,"height":340}}'>
class Component extends DCLogic {
renderVals() {
const a = this.props.active ?? 'payments';
const n = [
['general','Store details','M4 9l1.5-5h13L20 9M4 9a2.7 2.7 0 005.3 0 2.7 2.7 0 005.4 0A2.7 2.7 0 0020 9M5 12v8h14v-8'],
['payments','Payments','M4 7a2 2 0 012-2h12v4M5 7h14a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9a2 2 0 012-2zM16.5 13.5h.01'],
['shipping','Shipping and couriers','M2 6h11v10H2zM13 9h4l4 4v3h-8M6.5 15.5a2 2 0 100 4 2 2 0 000-4zM17.5 15.5a2 2 0 100 4 2 2 0 000-4z'],
['integrations','Integrations and keys','M10 14a4 4 0 005.7 0l3-3a4 4 0 00-5.7-5.7l-1 1M14 10a4 4 0 00-5.7 0l-3 3a4 4 0 005.7 5.7l1-1'],
['notifications','Notifications and SMS','M4 5h16v11H9l-5 4V5z'],
['domains','Domains','M12 3a9 9 0 100 18 9 9 0 000-18zM3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18'],
['staff','Staff and permissions','M9 11a3.5 3.5 0 100-7 3.5 3.5 0 000 7zM2.5 20c.5-3.5 3.2-5.5 6.5-5.5s6 2 6.5 5.5M16 4.7a3.5 3.5 0 010 6.6M18 14.8c2 .6 3.2 2.3 3.5 5.2'],
['billing','Plan and billing','M4.5 5h15A2.5 2.5 0 0122 7.5v9a2.5 2.5 0 01-2.5 2.5h-15A2.5 2.5 0 012 16.5v-9A2.5 2.5 0 014.5 5zM2 10h20'],
['languages','Language and currency','M5 6V4h14v2M12 4v16M9 20h6'],
];
return { items: n.map(([k,label,d]) => ({ label, d, bg: k===a?'#F4F3FF':'transparent', color: k===a?'#5B4FE8':'#1A1A4E', weight: k===a?700:500 })) };
}
}
</script>
</body>
</html>
