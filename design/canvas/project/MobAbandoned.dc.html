<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mobile abandoned orders call list</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;background:#FAFAFC;font-family:'Plus Jakarta Sans','Hind Siliguri',sans-serif;color:#1A1A4E">
<div style="position:absolute;left:0;right:0;top:0;bottom:84px;overflow:hidden">

<div style="background:#fff;border-bottom:1px solid #E7E7F0;padding:16px 8px 0">
<div style="display:flex;align-items:center;gap:4px"><div style="width:44px;height:44px;display:flex;align-items:center;justify-content:center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1A1A4E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-label="Back" role="img"><path d="M15 6l-6 6 6 6"/></svg></div><div style="flex-grow:1;font-size:17px;font-weight:700">Abandoned orders</div></div>
<div style="display:flex;gap:8px;padding:6px 8px 14px"><div style="padding:9px 16px;border-radius:20px;background:#5B4FE8;color:#fff;font-size:13.5px;font-weight:700">To call 9</div><div style="padding:9px 16px;border-radius:20px;border:1px solid #D5D5E4;font-size:13.5px;font-weight:600;color:#4B4B73">Called 14</div><div style="padding:9px 16px;border-radius:20px;border:1px solid #D5D5E4;font-size:13.5px;font-weight:600;color:#4B4B73">Won 8</div></div>
</div>

<div style="padding:14px 16px;display:flex;flex-direction:column;gap:12px">
<div style="display:flex;gap:10px"><div style="flex:1;background:#fff;border:1px solid #E7E7F0;border-radius:12px;padding:12px 14px"><div style="font-size:12.5px;color:#4B4B73">Left behind</div><div style="font-size:20px;font-weight:700;font-variant-numeric:tabular-nums">৳ 62,400</div></div><div style="flex:1;background:#fff;border:1px solid #E7E7F0;border-radius:12px;padding:12px 14px"><div style="font-size:12.5px;color:#4B4B73">Recovered</div><div style="font-size:20px;font-weight:700;color:#15803D;font-variant-numeric:tabular-nums">৳ 14,880</div></div></div>

<div style="background:#5B4FE8;color:#fff;border-radius:14px;padding:16px 18px;display:flex;align-items:center;gap:12px"><div style="flex:1"><div style="font-size:15px;font-weight:700">Start calling</div><div style="font-size:12.5px;color:#D6D3FA;margin-top:2px">9 customers waiting, newest first</div></div><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 005 5L15 13l5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2z"/></svg></div>

<sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
<div style="background:#fff;border:1px solid #E7E7F0;border-radius:14px;padding:14px 16px">
<div style="display:flex;align-items:center;gap:8px"><div style="font-size:15px;font-weight:700;flex-grow:1">{{r.name}}</div><div style="font-size:12px;color:#6B6B8D">{{r.ago}} ago</div></div>
<div style="font-size:13px;color:#4B4B73;margin-top:3px;font-variant-numeric:tabular-nums">{{r.phone}}</div>
<div style="display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px"><span style="flex-grow:1;color:#4B4B73">{{r.cart}} · stopped at {{r.stage}}</span><b style="font-variant-numeric:tabular-nums">{{r.val}}</b></div>
<div style="display:flex;gap:8px;margin-top:12px"><div style="flex:1.3;height:44px;border-radius:10px;background:#5B4FE8;color:#fff;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center">Call</div><div style="flex:1;height:44px;border:1px solid #D5D5E4;border-radius:10px;font-size:13.5px;font-weight:600;display:flex;align-items:center;justify-content:center">SMS</div><div style="flex:1;height:44px;border:1px solid #D5D5E4;border-radius:10px;font-size:13.5px;font-weight:600;display:flex;align-items:center;justify-content:center">Create order</div></div>
</div>
</sc-for>
</div>
</div>
<div style="position:absolute;left:0;bottom:0"><dc-import name="MobileTabs" active="orders" hint-size="390px,84px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

renderVals() {
return { rows: [

{ name:'Tasnim Ahmed', phone:'01911-334422', cart:'Linen Shirt x2', stage:'phone', val:'৳ 1,700', ago:'2 hr' },
] };
}
}
</script>
</body>
</html>
