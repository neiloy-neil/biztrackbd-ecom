<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mobile more menu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;background:#FAFAFC;font-family:'Plus Jakarta Sans','Hind Siliguri',sans-serif;color:#1A1A4E">
<div style="position:absolute;left:0;right:0;top:0;bottom:84px;overflow:hidden;padding:20px 16px 0;box-sizing:border-box;display:flex;flex-direction:column;gap:14px">

<div style="font-size:24px;font-weight:700">More</div>

<div style="background:#fff;border:1px solid #E7E7F0;border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:12px">
<div style="width:48px;height:48px;border-radius:12px;background:#E9DCCB;color:#8C5A3C;font-weight:700;font-size:22px;display:flex;align-items:center;justify-content:center">র</div>
<div style="flex-grow:1;min-width:0"><div style="font-size:15px;font-weight:700">Rongdhonu Fashion</div><div style="font-size:12.5px;color:#6B6B8D">rongdhonu.biztrackbd.com</div></div>
<div style="padding:8px 12px;border-radius:10px;border:1px solid #D5D5E4;font-size:13px;font-weight:700;display:flex;align-items:center;min-height:28px">View store</div>
</div>

<div style="background:#F4F3FF;border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:12px">
<div style="flex-grow:1"><div style="font-size:13.5px;font-weight:700">Free trial · 9 days left</div><div style="font-size:12.5px;color:#4B4B73">Pick a plan to keep your store online.</div></div>
<div style="height:40px;padding:0 16px;border-radius:10px;background:#5B4FE8;color:#fff;font-size:13.5px;font-weight:700;display:flex;align-items:center">Choose plan</div>
</div>

<div style="background:#fff;border:1px solid #E7E7F0;border-radius:16px;overflow:hidden">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
<div style="display:flex;align-items:center;gap:14px;padding:0 16px;height:56px;border-bottom:1px solid #F0F0F6">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4B4B73" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{r.d}}"/></svg>
<div style="flex-grow:1;font-size:15px;font-weight:600">{{r.label}}</div>
<sc-if value="{{r.hasNote}}" hint-placeholder-val="{{false}}"><div style="font-size:12px;font-weight:700;color:{{r.noteColor}}">{{r.note}}</div></sc-if>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9A9AB5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
</div>
</sc-for>
</div>

<div style="display:flex;align-items:center;gap:12px;background:#fff;border:1px solid #E7E7F0;border-radius:16px;padding:0 16px;height:56px">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4B4B73" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 6V4h14v2M12 4v16M9 20h6"/></svg>
<div style="flex-grow:1;font-size:15px;font-weight:600">Language</div>
<div style="display:flex;padding:3px;border-radius:19px;background:#EFEFF6;font-size:13px;font-weight:600"><div style="padding:6px 14px;border-radius:16px;background:#fff;border:1px solid #E7E7F0">English</div><div style="padding:6px 14px;color:#6B6B8D;font-family:'Hind Siliguri',sans-serif">বাংলা</div></div>
</div>

</div>
<div style="position:absolute;left:0;bottom:0"><dc-import name="MobileTabs" active="more" hint-size="390px,84px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const d = [
['Online store design','M4 9l1.5-5h13L20 9M4 9a2.7 2.7 0 005.3 0 2.7 2.7 0 005.4 0A2.7 2.7 0 0020 9M5 12v8h14v-8'],
['Discounts and coupons','M19 5L5 19M7 9.5a2.5 2.5 0 100-5 2.5 2.5 0 000 5zM17 19.5a2.5 2.5 0 100-5 2.5 2.5 0 000 5z'],
['Reports','M4 20V4M4 20h16M8 16v-4M12 16V8M16 16v-6'],
['Payments','M4 7a2 2 0 012-2h12v4M5 7h14a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9a2 2 0 012-2z'],
['Couriers and delivery','M2 6h11v10H2zM13 9h4l4 4v3h-8M6.5 15.5a2 2 0 100 4 2 2 0 000-4zM17.5 15.5a2 2 0 100 4 2 2 0 000-4z'],
['Domain','M12 3a9 9 0 100 18 9 9 0 000-18zM3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18','Waiting for DNS','#B45309'],
['Staff','M9 11a3.5 3.5 0 100-7 3.5 3.5 0 000 7zM2.5 20c.5-3.5 3.2-5.5 6.5-5.5s6 2 6.5 5.5','2 of 2','#6B6B8D'],
['Help and support','M12 3a9 9 0 100 18 9 9 0 000-18zM9.5 9.5a2.5 2.5 0 114 2c-.9.6-1.5 1-1.5 2M12 17h.01'],
];
return { rows: d.map(([label,dd,note,noteColor]) => ({ label, d: dd, hasNote: !!note, note, noteColor })) };
}
}
</script>
</body>
</html>
