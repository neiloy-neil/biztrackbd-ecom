<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mobile landing pages</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;background:#FAFAFC;font-family:'Plus Jakarta Sans','Hind Siliguri',sans-serif;color:#1A1A4E">
<div style="position:absolute;left:0;right:0;top:0;bottom:84px;overflow:hidden">

<div style="background:#fff;border-bottom:1px solid #E7E7F0;padding:16px 8px 12px;display:flex;align-items:center;gap:4px"><div style="width:44px;height:44px;display:flex;align-items:center;justify-content:center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1A1A4E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-label="Back" role="img"><path d="M15 6l-6 6 6 6"/></svg></div><div style="flex-grow:1;font-size:17px;font-weight:700">Landing pages</div><div style="height:40px;padding:0 14px;border-radius:10px;background:#5B4FE8;color:#fff;font-size:13.5px;font-weight:700;display:flex;align-items:center;margin-right:8px">+ New</div></div>

<div style="padding:14px 16px;display:flex;flex-direction:column;gap:12px">
<div style="font-size:13.5px;color:#4B4B73;line-height:1.55">One product, one page, one order form. Share the link in your ads.</div>
<sc-for list="{{pages}}" as="p" hint-placeholder-count="3">
<div style="background:#fff;border:1px solid #E7E7F0;border-radius:14px;padding:12px;display:flex;gap:12px">
<div style="width:84px;height:112px;border-radius:10px;background:{{p.bg}};flex:0 0 84px;overflow:hidden;border:1px solid #E7E7F0"><div style="height:46px;background:{{p.hero}};padding:8px;box-sizing:border-box"><div style="width:44px;height:5px;background:#2B2118;border-radius:2px"></div><div style="width:30px;height:5px;background:#2B2118;border-radius:2px;margin-top:4px"></div><div style="width:24px;height:8px;background:{{p.acc}};border-radius:2px;margin-top:6px"></div></div><div style="display:flex;gap:4px;padding:6px"><div style="flex:1;height:36px;background:{{p.p1}};border-radius:4px"></div><div style="flex:1;height:36px;background:{{p.p2}};border-radius:4px"></div></div></div>
<div style="flex:1;min-width:0"><div style="display:flex;align-items:center;gap:6px"><b style="font-size:14.5px;flex:1">{{p.name}}</b><span style="padding:2px 9px;border-radius:10px;font-size:11.5px;font-weight:700;background:{{p.sb}};color:{{p.sc}}">{{p.status}}</span></div>
<div style="font-size:12px;color:#6B6B8D;margin-top:2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis">{{p.url}}</div>
<div style="display:flex;gap:16px;margin-top:10px;font-size:12px;color:#4B4B73"><div><b style="font-size:15px;color:#1A1A4E;font-variant-numeric:tabular-nums">{{p.visits}}</b><br>visits</div><div><b style="font-size:15px;color:#1A1A4E;font-variant-numeric:tabular-nums">{{p.orders}}</b><br>orders</div><div><b style="font-size:15px;color:#15803D">{{p.cr}}</b><br>convert</div></div>
<div style="display:flex;gap:8px;margin-top:10px"><div style="flex:1;height:40px;border-radius:8px;background:#F4F3FF;color:#5B4FE8;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center">Edit</div><div style="flex:1;height:40px;border:1px solid #D5D5E4;border-radius:8px;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center">Share</div></div></div>
</div>
</sc-for>
</div>
</div>
<div style="position:absolute;left:0;bottom:0"><dc-import name="MobileTabs" active="more" hint-size="390px,84px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { pages: [
{ name:'Eid Special Fatua', url:'/p/eid-fatua', status:'Live', visits:'1,284', orders:'96', cr:'7.5%', bg:'#FBF8F3', hero:'#F5EBD0', acc:'#8C5A3C', p1:'#F1E9DD', p2:'#E3EBE1', sb:'#E8F6EE', sc:'#15803D' },
{ name:'Linen Shirt Combo', url:'/p/linen-combo', status:'Live', visits:'902', orders:'58', cr:'6.4%', bg:'#FBF8F3', hero:'#E3EBE1', acc:'#1F4D3A', p1:'#E3EBE1', p2:'#E4E6EC', sb:'#E8F6EE', sc:'#15803D' },
{ name:'Winter Jacket Pre-order', url:'/p/jacket-preorder', status:'Draft', visits:'0', orders:'0', cr:'0%', bg:'#F7F5F0', hero:'#DDE5DA', acc:'#1F4D3A', p1:'#E1ECF4', p2:'#E4E6EC', sb:'#EFEFF6', sc:'#4B4B73' },
] };
}
}
</script>
</body>
</html>
