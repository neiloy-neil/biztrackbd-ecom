<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mobile COD settlement</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;background:#FAFAFC;font-family:'Plus Jakarta Sans','Hind Siliguri',sans-serif;color:#1A1A4E">
<div style="position:absolute;left:0;right:0;top:0;bottom:84px;overflow:hidden">

<div style="background:#fff;border-bottom:1px solid #E7E7F0;padding:16px 8px 12px;display:flex;align-items:center;gap:4px"><div style="width:44px;height:44px;display:flex;align-items:center;justify-content:center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1A1A4E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-label="Back" role="img"><path d="M15 6l-6 6 6 6"/></svg></div><div style="flex-grow:1;font-size:17px;font-weight:700">COD settlement</div></div>

<div style="padding:14px 16px;display:flex;flex-direction:column;gap:12px">
<div style="background:#1A1A4E;color:#fff;border-radius:16px;padding:18px 20px"><div style="font-size:13px;color:#B9B9E3">Couriers owe you</div><div style="font-size:32px;font-weight:700;margin:4px 0 12px;font-variant-numeric:tabular-nums;letter-spacing:-0.5px">৳ 63,300</div><div style="display:flex;gap:18px;font-size:12.5px"><div><div style="color:#B9B9E3">Received</div><b style="font-size:15px;font-variant-numeric:tabular-nums">৳ 2,41,500</b></div><div><div style="color:#B9B9E3">Does not match</div><b style="font-size:15px;color:#FFB4B4;font-variant-numeric:tabular-nums">৳ 20,000</b></div></div></div>

<div style="display:flex;gap:8px"><div style="padding:9px 14px;border-radius:20px;background:#5B4FE8;color:#fff;font-size:13px;font-weight:700">Check 7</div><div style="padding:9px 14px;border-radius:20px;border:1px solid #D5D5E4;font-size:13px;font-weight:600;color:#4B4B73">Not paid 21</div><div style="padding:9px 14px;border-radius:20px;border:1px solid #D5D5E4;font-size:13px;font-weight:600;color:#4B4B73">Matched</div></div>

<sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
<div style="background:#fff;border:1px solid #E7E7F0;border-left:4px solid {{r.c}};border-radius:14px;padding:14px 16px">
<div style="display:flex;align-items:center;gap:8px"><b style="font-size:14px;color:#5B4FE8;flex:1">{{r.o}}</b><span style="padding:3px 10px;border-radius:11px;font-size:12px;font-weight:700;background:{{r.bg}};color:{{r.c}}">{{r.res}}</span></div>
<div style="font-size:13px;color:#4B4B73;margin-top:3px">{{r.who}} · {{r.courier}} {{r.con}}</div>
<div style="display:flex;gap:14px;margin-top:10px;font-size:12.5px;color:#4B4B73;font-variant-numeric:tabular-nums"><div>You expect<br><b style="font-size:14px;color:#1A1A4E">{{r.exp}}</b></div><div>Paid<br><b style="font-size:14px;color:#1A1A4E">{{r.got}}</b></div><div>Missing<br><b style="font-size:14px;color:{{r.c}}">{{r.diff}}</b></div></div>
<div style="display:flex;gap:8px;margin-top:12px"><div style="flex:1.3;height:42px;border-radius:10px;background:#5B4FE8;color:#fff;font-size:13.5px;font-weight:700;display:flex;align-items:center;justify-content:center">Raise dispute</div><div style="flex:1;height:42px;border:1px solid #D5D5E4;border-radius:10px;font-size:13.5px;font-weight:600;display:flex;align-items:center;justify-content:center">Mark matched</div></div>
</div>
</sc-for>
</div>
</div>
<div style="position:absolute;left:0;bottom:0"><dc-import name="MobileTabs" active="orders" hint-size="390px,84px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { rows: [
{ o:'BT-10431', who:'Rakib Hasan', courier:'Steadfast', con:'SF-884201', exp:'৳ 3,058', got:'৳ 2,358', diff:'৳ 700', res:'Short paid', c:'#DC2626', bg:'#FCEBEB' },
{ o:'BT-10425', who:'Imran Hossain', courier:'Pathao', con:'PT-120933', exp:'৳ 6,690', got:'৳ 6,090', diff:'৳ 600', res:'Short paid', c:'#DC2626', bg:'#FCEBEB' },
{ o:'BT-10419', who:'Farhana Islam', courier:'Steadfast', con:'SF-883710', exp:'৳ 3,090', got:'None', diff:'৳ 3,090', res:'Missing', c:'#DC2626', bg:'#FCEBEB' },
] };
}
}
</script>
</body>
</html>
