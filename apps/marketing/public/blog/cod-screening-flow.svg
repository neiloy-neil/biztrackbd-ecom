<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-label="Four steps to screen a COD order: check delivery history, ask for an advance if risky, confirm by phone, then book the courier from the order">
<title>Four steps to screen a COD order: check delivery history, ask for an advance if risky, confirm by phone, then book the courier from the order</title>
<rect x="7" y="7" width="1186" height="526" rx="28" fill="#FBF7EC" stroke="#0B4D3B" stroke-width="8"/>
<text x="56" y="86" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="34" font-weight="800" fill="#0B4D3B">Screen every COD order in four steps</text>
<text x="56" y="124" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="20" fill="#3D5A52">Spend seconds on all orders, minutes only on risky ones</text>
<rect x="56.0" y="160" width="246.5" height="290" rx="22" fill="#fff" stroke="#C6DFD3" stroke-width="2.5"/><circle cx="102.0" cy="212" r="26" fill="#F2A900"/><text x="102.0" y="221" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="800" fill="#0B4D3B">1</text><text x="80.0" y="280" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="25" font-weight="800" fill="#0B4D3B">Check history</text><text x="80.0" y="318" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#3D5A52">See how many parcels</text><text x="80.0" y="346" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#3D5A52">this phone number</text><text x="80.0" y="374" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#3D5A52">accepted or refused</text><path d="M315.5 291l14 14l-14 14M297.5 305h32" fill="none" stroke="#946300" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="336.5" y="160" width="246.5" height="290" rx="22" fill="#fff" stroke="#C6DFD3" stroke-width="2.5"/><circle cx="382.5" cy="212" r="26" fill="#F2A900"/><text x="382.5" y="221" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="800" fill="#0B4D3B">2</text><text x="360.5" y="280" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="25" font-weight="800" fill="#0B4D3B">Ask for advance</text><text x="360.5" y="318" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#3D5A52">On risky orders only:</text><text x="360.5" y="346" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#3D5A52">a small bKash or</text><text x="360.5" y="374" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#3D5A52">Nagad delivery fee</text><path d="M596.0 291l14 14l-14 14M578.0 305h32" fill="none" stroke="#946300" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="617.0" y="160" width="246.5" height="290" rx="22" fill="#fff" stroke="#C6DFD3" stroke-width="2.5"/><circle cx="663.0" cy="212" r="26" fill="#F2A900"/><text x="663.0" y="221" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="800" fill="#0B4D3B">3</text><text x="641.0" y="280" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="25" font-weight="800" fill="#0B4D3B">Confirm</text><text x="641.0" y="318" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#3D5A52">Call or WhatsApp to</text><text x="641.0" y="346" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#3D5A52">confirm address,</text><text x="641.0" y="374" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#3D5A52">product and total</text><path d="M876.5 291l14 14l-14 14M858.5 305h32" fill="none" stroke="#946300" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="897.5" y="160" width="246.5" height="290" rx="22" fill="#fff" stroke="#C6DFD3" stroke-width="2.5"/><circle cx="943.5" cy="212" r="26" fill="#F2A900"/><text x="943.5" y="221" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="800" fill="#0B4D3B">4</text><text x="921.5" y="280" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="25" font-weight="800" fill="#0B4D3B">Book courier</text><text x="921.5" y="318" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#3D5A52">Send pickup to</text><text x="921.5" y="346" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#3D5A52">Steadfast, Pathao</text><text x="921.5" y="374" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#3D5A52">or RedX from the order</text><g transform="translate(56 478)"><rect width="30" height="30" rx="8" fill="#0B4D3B"/><rect x="8" y="9" width="4" height="14" rx="1.5" fill="#fff"/><circle cx="19" cy="17" r="5" fill="none" stroke="#fff" stroke-width="3"/><path d="M10 3l4 5H6z" fill="#F2A900"/></g>
<text x="96" y="500" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="800" fill="#0B4D3B">biztrack<tspan fill="#946300">.bd</tspan></text>
</svg>
