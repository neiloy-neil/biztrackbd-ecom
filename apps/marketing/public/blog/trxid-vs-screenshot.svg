<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-label="Screenshot proof compared with TrxID matching: a screenshot can be edited and is hard to search, while a TrxID is a unique code you can match against your wallet">
<title>Screenshot proof compared with TrxID matching: a screenshot can be edited and is hard to search, while a TrxID is a unique code you can match against your wallet</title>
<rect x="7" y="7" width="1186" height="526" rx="28" fill="#FBF7EC" stroke="#0B4D3B" stroke-width="8"/>
<text x="56" y="86" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="34" font-weight="800" fill="#0B4D3B">Screenshot proof vs TrxID matching</text>
<text x="56" y="124" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="20" fill="#3D5A52">Why a unique code beats a picture</text>
<rect x="56" y="160" width="527.0" height="290" rx="22" fill="#fff" stroke="#C6DFD3" stroke-width="2.5"/><rect x="56" y="160" width="527.0" height="64" rx="22" fill="#E3F1EA"/><rect x="56" y="200" width="527.0" height="24" fill="#E3F1EA"/><text x="82" y="203" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="800" fill="#0B4D3B">Screenshot</text><circle cx="96" cy="266" r="15" fill="#E3F1EA" stroke="#C6DFD3" stroke-width="2"/><path d="M90 260l12 12m0 -12l-12 12" stroke="#3D5A52" stroke-width="3.5" stroke-linecap="round"/><text x="128" y="272" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="21" fill="#3D5A52">Can be edited in a minute</text><circle cx="96" cy="324" r="15" fill="#E3F1EA" stroke="#C6DFD3" stroke-width="2"/><path d="M90 318l12 12m0 -12l-12 12" stroke="#3D5A52" stroke-width="3.5" stroke-linecap="round"/><text x="128" y="330" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="21" fill="#3D5A52">Does not prove money arrived</text><circle cx="96" cy="382" r="15" fill="#E3F1EA" stroke="#C6DFD3" stroke-width="2"/><path d="M90 376l12 12m0 -12l-12 12" stroke="#3D5A52" stroke-width="3.5" stroke-linecap="round"/><text x="128" y="388" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="21" fill="#3D5A52">Buried in message threads</text><circle cx="96" cy="440" r="15" fill="#E3F1EA" stroke="#C6DFD3" stroke-width="2"/><path d="M90 434l12 12m0 -12l-12 12" stroke="#3D5A52" stroke-width="3.5" stroke-linecap="round"/><text x="128" y="446" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="21" fill="#3D5A52">Hard to match to an order</text><rect x="617.0" y="160" width="527.0" height="290" rx="22" fill="#fff" stroke="#0B4D3B" stroke-width="4"/><rect x="617.0" y="160" width="527.0" height="64" rx="22" fill="#0B4D3B"/><rect x="617.0" y="200" width="527.0" height="24" fill="#0B4D3B"/><text x="643.0" y="203" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="800" fill="#fff">TrxID</text><circle cx="657.0" cy="266" r="15" fill="#F2A900"/><path d="M649.0 266l6 6l11 -12" fill="none" stroke="#0B4D3B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="689.0" y="272" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="21" fill="#3D5A52">A unique code per payment</text><circle cx="657.0" cy="324" r="15" fill="#F2A900"/><path d="M649.0 324l6 6l11 -12" fill="none" stroke="#0B4D3B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="689.0" y="330" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="21" fill="#3D5A52">Appears in your own wallet</text><circle cx="657.0" cy="382" r="15" fill="#F2A900"/><path d="M649.0 382l6 6l11 -12" fill="none" stroke="#0B4D3B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="689.0" y="388" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="21" fill="#3D5A52">Saved on the order itself</text><circle cx="657.0" cy="440" r="15" fill="#F2A900"/><path d="M649.0 440l6 6l11 -12" fill="none" stroke="#0B4D3B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="689.0" y="446" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="21" fill="#3D5A52">Matched to amount and number</text><g transform="translate(56 478)"><rect width="30" height="30" rx="8" fill="#0B4D3B"/><rect x="8" y="9" width="4" height="14" rx="1.5" fill="#fff"/><circle cx="19" cy="17" r="5" fill="none" stroke="#fff" stroke-width="3"/><path d="M10 3l4 5H6z" fill="#F2A900"/></g>
<text x="96" y="500" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="800" fill="#0B4D3B">biztrack<tspan fill="#946300">.bd</tspan></text>
</svg>
