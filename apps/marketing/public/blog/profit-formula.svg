<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-label="The profit formula: sale price, minus product and packing cost, minus courier and ad cost, minus a share of return losses, equals true profit">
<title>The profit formula: sale price, minus product and packing cost, minus courier and ad cost, minus a share of return losses, equals true profit</title>
<rect x="7" y="7" width="1186" height="526" rx="28" fill="#FBF7EC" stroke="#0B4D3B" stroke-width="8"/>
<text x="56" y="86" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="34" font-weight="800" fill="#0B4D3B">How to find your real profit per order</text>
<text x="56" y="124" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="20" fill="#3D5A52">Sales are not profit: subtract every cost, including returns</text>
<rect x="56.0" y="160" width="200.0" height="290" rx="22" fill="#fff" stroke="#C6DFD3" stroke-width="2.5"/><circle cx="102.0" cy="212" r="26" fill="#F2A900"/><text x="102.0" y="222" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="800" fill="#0B4D3B">+</text><text x="78.0" y="280" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="800" fill="#0B4D3B">Sale price</text><text x="78.0" y="318" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" fill="#3D5A52">What the customer</text><text x="78.0" y="346" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" fill="#3D5A52">pays on delivery</text><rect x="278.0" y="160" width="200.0" height="290" rx="22" fill="#fff" stroke="#C6DFD3" stroke-width="2.5"/><circle cx="324.0" cy="212" r="26" fill="#F2A900"/><text x="324.0" y="222" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="800" fill="#0B4D3B">-</text><text x="300.0" y="280" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="800" fill="#0B4D3B">Product cost</text><text x="300.0" y="318" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" fill="#3D5A52">What you paid for</text><text x="300.0" y="346" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" fill="#3D5A52">it, plus packing</text><rect x="500.0" y="160" width="200.0" height="290" rx="22" fill="#fff" stroke="#C6DFD3" stroke-width="2.5"/><circle cx="546.0" cy="212" r="26" fill="#F2A900"/><text x="546.0" y="222" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="800" fill="#0B4D3B">-</text><text x="522.0" y="280" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="800" fill="#0B4D3B">Courier + ads</text><text x="522.0" y="318" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" fill="#3D5A52">Delivery fee and</text><text x="522.0" y="346" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" fill="#3D5A52">ad cost per order</text><rect x="722.0" y="160" width="200.0" height="290" rx="22" fill="#fff" stroke="#C6DFD3" stroke-width="2.5"/><circle cx="768.0" cy="212" r="26" fill="#F2A900"/><text x="768.0" y="222" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="800" fill="#0B4D3B">-</text><text x="744.0" y="280" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="800" fill="#0B4D3B">Returns</text><text x="744.0" y="318" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" fill="#3D5A52">A share of what</text><text x="744.0" y="346" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" fill="#3D5A52">refused parcels</text><text x="744.0" y="374" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" fill="#3D5A52">cost you</text><rect x="944.0" y="160" width="200.0" height="290" rx="22" fill="#0B4D3B" stroke="#0B4D3B" stroke-width="2.5"/><circle cx="990.0" cy="212" r="26" fill="#F2A900"/><text x="990.0" y="222" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="800" fill="#0B4D3B">=</text><text x="966.0" y="280" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="800" fill="#fff">True profit</text><text x="966.0" y="318" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" fill="#E3F1EA">What you really</text><text x="966.0" y="346" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" fill="#E3F1EA">keep from each</text><text x="966.0" y="374" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" fill="#E3F1EA">order</text><g transform="translate(56 478)"><rect width="30" height="30" rx="8" fill="#0B4D3B"/><rect x="8" y="9" width="4" height="14" rx="1.5" fill="#fff"/><circle cx="19" cy="17" r="5" fill="none" stroke="#fff" stroke-width="3"/><path d="M10 3l4 5H6z" fill="#F2A900"/></g>
<text x="96" y="500" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="800" fill="#0B4D3B">biztrack<tspan fill="#946300">.bd</tspan></text>
</svg>
