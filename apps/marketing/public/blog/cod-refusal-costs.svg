<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-label="The four costs of one refused COD parcel: outbound delivery, return shipping, stock stuck in transit, and the ad money spent to win the order">
<title>The four costs of one refused COD parcel: outbound delivery, return shipping, stock stuck in transit, and the ad money spent to win the order</title>
<rect x="7" y="7" width="1186" height="526" rx="28" fill="#FBF7EC" stroke="#0B4D3B" stroke-width="8"/>
<text x="56" y="86" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="34" font-weight="800" fill="#0B4D3B">What one refused COD parcel really costs</text>
<text x="56" y="124" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="20" fill="#3D5A52">You pay to send it, pay to get it back, and lose the sale</text>
<rect x="56.0" y="160" width="254.0" height="290" rx="22" fill="#fff" stroke="#C6DFD3" stroke-width="2.5"/><circle cx="102.0" cy="212" r="26" fill="#F2A900"/><path d="M91.0 212h22m-9 -9l9 9l-9 9" fill="none" stroke="#0B4D3B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="80.0" y="280" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="25" font-weight="800" fill="#0B4D3B">Delivery out</text><text x="80.0" y="318" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#3D5A52">The full outbound</text><text x="80.0" y="346" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#3D5A52">courier fee is</text><text x="80.0" y="374" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#3D5A52">charged anyway</text><rect x="334.0" y="160" width="254.0" height="290" rx="22" fill="#fff" stroke="#C6DFD3" stroke-width="2.5"/><circle cx="380.0" cy="212" r="26" fill="#F2A900"/><path d="M391.0 212h-22m9 -9l-9 9l9 9" fill="none" stroke="#0B4D3B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="358.0" y="280" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="25" font-weight="800" fill="#0B4D3B">Return trip</text><text x="358.0" y="318" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#3D5A52">Couriers usually</text><text x="358.0" y="346" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#3D5A52">charge part of the</text><text x="358.0" y="374" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#3D5A52">fee again to return it</text><rect x="612.0" y="160" width="254.0" height="290" rx="22" fill="#fff" stroke="#C6DFD3" stroke-width="2.5"/><circle cx="658.0" cy="212" r="26" fill="#F2A900"/><circle cx="658.0" cy="212" r="12" fill="none" stroke="#0B4D3B" stroke-width="4"/><path d="M658.0 206v6l5 3" fill="none" stroke="#0B4D3B" stroke-width="4" stroke-linecap="round"/><text x="636.0" y="280" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="25" font-weight="800" fill="#0B4D3B">Stock stuck</text><text x="636.0" y="318" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#3D5A52">Your product sits in</text><text x="636.0" y="346" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#3D5A52">a van or hub for days,</text><text x="636.0" y="374" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#3D5A52">unsellable</text><rect x="890.0" y="160" width="254.0" height="290" rx="22" fill="#fff" stroke="#C6DFD3" stroke-width="2.5"/><circle cx="936.0" cy="212" r="26" fill="#F2A900"/><path d="M927.0 203l18 18m0 -18l-18 18" stroke="#0B4D3B" stroke-width="4.5" stroke-linecap="round"/><text x="914.0" y="280" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="25" font-weight="800" fill="#0B4D3B">Ad money lost</text><text x="914.0" y="318" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#3D5A52">What you paid for</text><text x="914.0" y="346" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#3D5A52">the ad click that</text><text x="914.0" y="374" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#3D5A52">won the order</text><g transform="translate(56 478)"><rect width="30" height="30" rx="8" fill="#0B4D3B"/><rect x="8" y="9" width="4" height="14" rx="1.5" fill="#fff"/><circle cx="19" cy="17" r="5" fill="none" stroke="#fff" stroke-width="3"/><path d="M10 3l4 5H6z" fill="#F2A900"/></g>
<text x="96" y="500" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="800" fill="#0B4D3B">biztrack<tspan fill="#946300">.bd</tspan></text>
</svg>
