<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-label="Four things to compare before choosing a store platform for Bangladesh: total monthly cost in taka, local payments, courier booking, and COD fraud protection">
<title>Four things to compare before choosing a store platform for Bangladesh: total monthly cost in taka, local payments, courier booking, and COD fraud protection</title>
<rect x="7" y="7" width="1186" height="526" rx="28" fill="#FBF7EC" stroke="#0B4D3B" stroke-width="8"/>
<text x="56" y="86" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="34" font-weight="800" fill="#0B4D3B">Compare four things before you choose</text>
<text x="56" y="124" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="20" fill="#3D5A52">Use numbers from your own shop, not the headline price</text>
<rect x="56.0" y="160" width="246.5" height="290" rx="22" fill="#fff" stroke="#C6DFD3" stroke-width="2.5"/><circle cx="102.0" cy="212" r="26" fill="#F2A900"/><text x="102.0" y="222" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="800" fill="#0B4D3B">1</text><text x="78.0" y="280" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="25" font-weight="800" fill="#0B4D3B">Cost in taka</text><text x="78.0" y="318" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#3D5A52">Plan, apps and sales</text><text x="78.0" y="346" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#3D5A52">fees, added up for</text><text x="78.0" y="374" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#3D5A52">one month</text><rect x="336.5" y="160" width="246.5" height="290" rx="22" fill="#fff" stroke="#C6DFD3" stroke-width="2.5"/><circle cx="382.5" cy="212" r="26" fill="#F2A900"/><text x="382.5" y="222" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="800" fill="#0B4D3B">2</text><text x="358.5" y="280" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="25" font-weight="800" fill="#0B4D3B">Local payments</text><text x="358.5" y="318" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#3D5A52">bKash, Nagad and COD</text><text x="358.5" y="346" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#3D5A52">paid straight to</text><text x="358.5" y="374" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#3D5A52">your own wallet</text><rect x="617.0" y="160" width="246.5" height="290" rx="22" fill="#fff" stroke="#C6DFD3" stroke-width="2.5"/><circle cx="663.0" cy="212" r="26" fill="#F2A900"/><text x="663.0" y="222" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="800" fill="#0B4D3B">3</text><text x="639.0" y="280" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="25" font-weight="800" fill="#0B4D3B">Courier booking</text><text x="639.0" y="318" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#3D5A52">Book from the order,</text><text x="639.0" y="346" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#3D5A52">not by copying into</text><text x="639.0" y="374" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#3D5A52">a courier website</text><rect x="897.5" y="160" width="246.5" height="290" rx="22" fill="#fff" stroke="#C6DFD3" stroke-width="2.5"/><circle cx="943.5" cy="212" r="26" fill="#F2A900"/><text x="943.5" y="222" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="800" fill="#0B4D3B">4</text><text x="919.5" y="280" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="25" font-weight="800" fill="#0B4D3B">COD protection</text><text x="919.5" y="318" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#3D5A52">See a customer's</text><text x="919.5" y="346" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#3D5A52">delivery history</text><text x="919.5" y="374" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#3D5A52">before you ship</text><g transform="translate(56 478)"><rect width="30" height="30" rx="8" fill="#0B4D3B"/><rect x="8" y="9" width="4" height="14" rx="1.5" fill="#fff"/><circle cx="19" cy="17" r="5" fill="none" stroke="#fff" stroke-width="3"/><path d="M10 3l4 5H6z" fill="#F2A900"/></g>
