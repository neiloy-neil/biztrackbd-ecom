# Database migrations for production. The four apps are deployed by Vercel itself (its GitHub integration builds every push to main), so
# this workflow only applies pending Prisma migrations to Supabase, as the owner login, once CI has passed on main.
#
# Order of events on a push to main: Vercel starts building the apps immediately; this workflow runs after CI succeeds. So write migrations
# so the PREVIOUS version of the code still works with the new schema (add columns and tables first, remove things in a later release).
#
# Secret to add under Settings > Secrets and variables > Actions (name only here, the value never goes in the repository):
#   SUPABASE_DB_URL   the owner connection (session pooler, user postgres.<ref>), used only for `prisma migrate deploy`
# Automatic runs stay off until you set the repository VARIABLE DEPLOY_ENABLED to true (Settings > Secrets and variables > Actions > Variables).
# A manual run (Actions > Deploy > Run workflow) always works.
# Create a GitHub Environment named "production" with required reviewers if every migration should wait for a person.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    name: Apply database migrations
    if: ${{ github.event_name == 'workflow_dispatch' || (vars.DEPLOY_ENABLED == 'true' && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: prisma migrate deploy
        env:
          DIRECT_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: pnpm --filter @biztrackbd/db exec prisma migrate deploy
      - name: Reminder
        run: echo "After a migration that adds tables, run the anon/authenticated grant check from docs/17 (Supabase checklist)."
