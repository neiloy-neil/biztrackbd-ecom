# Nightly encrypted backup of the production database (Supabase Free has no backups of its own).
# Dumps the database, compresses and encrypts it (AES-256-GCM), uploads it to the private "backups" bucket in Supabase Storage and keeps the newest 14.
# Secrets (Settings > Secrets and variables > Actions):
#   SUPABASE_DB_URL                owner connection (session pooler), used only for the dump
#   BACKUP_ENCRYPTION_KEY_HEX      64 hex characters. KEEP A SECOND COPY OUTSIDE GITHUB (password manager): a backup cannot be opened without it.
#                                  Make one with: node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY   where the encrypted file is stored
# Not yet run on GitHub's runners. Check the first run, then do a restore drill (pnpm drill:backup, see docs/19).
name: Backup

on:
  workflow_dispatch:
  schedule:
    - cron: "30 19 * * *" # 01:30 in Dhaka

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install a pg_dump that matches Supabase (Postgres 17)
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          sudo sh -c "echo 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $VERSION_CODENAME-pgdg main' > /etc/apt/sources.list.d/pgdg.list"
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          echo "PG_BIN=/usr/lib/postgresql/17/bin" >> "$GITHUB_ENV"
      - name: Back up
        env:
          BACKUP_SOURCE_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_ENCRYPTION_KEY_HEX: ${{ secrets.BACKUP_ENCRYPTION_KEY_HEX }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BACKUP_KEEP: "14"
        run: pnpm --filter @biztrackbd/core exec tsx scripts/backup-run.ts
